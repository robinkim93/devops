apiVersion: v1
kind: Pod
metadata:
  name: sidecar-pod
  labels:
    app: sidecar-demo
spec:
  containers:
  - name: nginx
    image: nginx:1.24
    ports:
      - containerPort: 80
    volumeMounts:
      - name: shared-data
        mountPath: /usr/share/nginx/html

  - name: content-creator
    image: alpine
    command: ["/bin/sh", "-c"]
    args:
      - |
        while true; do
          echo "<!DOCTYPE html>
          <html>
          <body>
          <h1>Generated at $(date)</h1>
          <p>Pod: $(hostname)</p>
          </body>
          </html>" > /data/index.html
          sleep 10
        done
    volumeMounts:
      - name: shared-data
        mountPath: /data
  volumes:
    - name: shared-data
      emptyDir: {}
