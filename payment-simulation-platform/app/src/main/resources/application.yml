server:
  port: 8080

spring:
  application:
    name: payment-simulation-platform
  
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/payment_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: payment_user
    password: payment_password
    driver-class-name: com.mysql.cj.jdbc.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      timeout: 2000ms

jwt:
  secret: payment-simulation-platform-secret-key-for-jwt-token-generation-2024
  expiration: 3600000 # 1 hour

logging:
  level:
    com.payment: DEBUG
    org.springframework.web: INFO
