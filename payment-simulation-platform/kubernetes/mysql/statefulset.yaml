apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql
  namespace: payment-simulation-platform
spec:
  serviceName: mysql
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
        - name: mysql
          image: robinkim3/payment-mysql:latest
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_ROOT_PASSWORD
              value: rootpassword
            - name: MYSQL_DATABASE
              value: payment_db
            - name: MYSQL_USER
              value: payment_user
            - name: MYSQL_PASSWORD
              value: payment_password
            
    