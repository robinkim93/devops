apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: payment-simulation-platform
spec:
  serviceName: redis
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: robinkim3/payment-redis:latest
          ports:
            - containerPort: 6379
          
    